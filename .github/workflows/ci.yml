name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: baum
          POSTGRES_PASSWORD: baum
          POSTGRES_DB: baum_ocr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baum -d baum_ocr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Tesseract ve poppler-utils kur
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-tur tesseract-ocr-eng poppler-utils

      - name: Bağımlılıkları indir
        working-directory: backend
        run: go mod tidy

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: Bilinen güvenlik açıklarını tara (govulncheck)
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Unit testler
        working-directory: backend
        run: go test ./...

      - name: Integration testler (gerçek tesseract)
        working-directory: backend
        run: go test -tags=integration ./...

      - name: Derleme
        working-directory: backend
        run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları kur
        working-directory: frontend
        run: npm ci

      - name: Bağımlılık güvenlik taraması (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true # şimdilik bilgilendirici; build'i kırmasın

      - name: Tip kontrolü
        working-directory: frontend
        run: npx tsc -b

      - name: Testler
        working-directory: frontend
        run: npx vitest run

      - name: Derleme
        working-directory: frontend
        run: npm run build
