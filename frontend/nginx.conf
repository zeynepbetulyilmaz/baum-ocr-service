server {
    listen 8080;
    listen 8443 ssl;

    # Yerel/demo ortam için kendinden imzalı sertifika (build sırasında
    # üretiliyor, bkz. Dockerfile). Tarayıcı "bağlantı güvenli değil"
    # uyarısı gösterecektir — bu, gerçek bir CA tarafından imzalanmadığı
    # için beklenen bir durumdur; production'da Let's Encrypt gibi gerçek
    # bir sertifika kullanılmalı.
    ssl_certificate     /etc/nginx/tls/selfsigned.crt;
    ssl_certificate_key /etc/nginx/tls/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 30m;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
